name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: node --test

  publish-docs:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PAGES_DEPLOY_TOKEN: a Personal Access Token (repo scope) with write
      # access to MichaelYagi/michaelyagi.github.io — the default
      # GITHUB_TOKEN can only push to this repo, not that one. Add it under
      # this repo's Settings → Secrets and variables → Actions.
      - name: Checkout michaelyagi.github.io
        uses: actions/checkout@v4
        with:
          repository: MichaelYagi/michaelyagi.github.io
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-site

      - name: Sync docs into pages-site/volley
        run: |
          rm -rf pages-site/volley
          mkdir -p pages-site/volley
          cp -r docs/. pages-site/volley/

      - name: Commit and push if changed
        working-directory: pages-site
        run: |
          git config user.name "volley-docs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add volley
          if git diff --cached --quiet; then
            echo "No doc changes to publish."
            exit 0
          fi
          git commit -m "Update volley docs (MichaelYagi/volley@${{ github.sha }})"
          git push
